services:
  - type: web
    name: ai-court
    env: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Shanghai
      - key: OPENCLAW_WORKSPACE
        value: /home/court/clawd
      - key: OPENCLAW_CONFIG_DIR
        value: /home/court/.openclaw
    disk:
      name: court-data
      mountPath: /home/court/.openclaw
      sizeGB: 5
